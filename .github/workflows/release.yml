# A tag v0.1.0-alpha.N builds the three executables and publishes them.
# The tag has to match `cite --version`. An alpha, beta, or rc tag is a prerelease.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            out: cite
          - name: macos-arm64
            os: macos-latest
            out: cite
          - name: windows-x64
            os: windows-latest
            out: cite.exe
    steps:
      - uses: actions/checkout@v4
      - uses: iffy/install-nim@v5
        with:
          version: release:2.4.0
      - name: Compile and self-test
        shell: bash
        run: |
          set -euo pipefail
          nim c --hints:off -d:release -o:"${{ matrix.out }}" src/cite.nim
          "./${{ matrix.out }}" --version
          "./${{ matrix.out }}" --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: cite-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cite-*
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          linux="dist/cite-linux-x64/cite"
          chmod +x "$linux"
          printed="$("$linux" --version)"
          number="${printed#cite }"
          if [ "v${number}" != "$tag" ]; then
            echo "tag ${tag} does not match ${printed}"
            exit 1
          fi
          mv "$linux" "cite-linux-x64"
          mv "dist/cite-macos-arm64/cite" "cite-macos-arm64"
          mv "dist/cite-windows-x64/cite.exe" "cite-windows-x64.exe"
          chmod +x cite-linux-x64 cite-macos-arm64
          notes="$(mktemp)"
          {
            echo "cite ${number}"
            echo
            echo "Alpha. The checked set is still growing. A quiet run means the checked rows were quiet. \`cite --matrix\` lists the rest. Silence is not a proof."
            echo
            echo "Each file is the program."
            echo
            echo "- \`cite-linux-x64\` for Linux x64"
            echo "- \`cite-macos-arm64\` for macOS Apple silicon"
            echo "- \`cite-windows-x64.exe\` for Windows x64"
          } > "$notes"
          if [[ "$tag" == *alpha* || "$tag" == *beta* || "$tag" == *rc* ]]; then
            gh release create "$tag" \
              --title "cite ${number}" \
              --notes-file "$notes" \
              --prerelease \
              cite-linux-x64 \
              cite-macos-arm64 \
              cite-windows-x64.exe
          else
            gh release create "$tag" \
              --title "cite ${number}" \
              --notes-file "$notes" \
              cite-linux-x64 \
              cite-macos-arm64 \
              cite-windows-x64.exe
          fi
