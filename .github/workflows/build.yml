# Self-test on a push to master and on a pull request.
# A version tag publishes the executables from release.yml.
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            out: cite
          - name: macos-arm64
            os: macos-latest
            out: cite
          - name: windows-x64
            os: windows-latest
            out: cite.exe
    steps:
      - uses: actions/checkout@v4
      - uses: iffy/install-nim@v5
        with:
          version: release:2.4.0
      - name: Compile and self-test
        shell: bash
        run: |
          set -euo pipefail
          nim c --hints:off -d:release -o:"${{ matrix.out }}" src/cite.nim
          "./${{ matrix.out }}" --version
          "./${{ matrix.out }}" --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: cite-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error
